<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event History - Wine Club</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .history-header {
            background: linear-gradient(135deg, var(--wine-burgundy), var(--wine-red));
            color: white;
            padding: var(--space-xl);
            text-align: center;
        }

        .history-header__nav {
            display: flex;
            justify-content: center;
            gap: var(--space-lg);
            margin-top: var(--space-lg);
        }

        .history-header__nav a {
            color: white;
            opacity: 0.8;
            padding-bottom: var(--space-xs);
            border-bottom: 2px solid transparent;
        }

        .history-header__nav a:hover,
        .history-header__nav a.active {
            opacity: 1;
            border-bottom-color: var(--wine-gold);
        }

        .history-content {
            padding: var(--space-xl);
            max-width: 1000px;
            margin: 0 auto;
        }

        .event-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease;
        }

        .event-card:hover {
            box-shadow: var(--shadow-md);
        }

        .event-card__header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-md);
        }

        .event-card__title {
            font-size: 1.5rem;
            color: var(--wine-burgundy);
            margin: 0;
        }

        .event-card__date {
            color: var(--gray-medium);
            font-size: 0.875rem;
        }

        .event-card__theme {
            color: var(--wine-rose);
            font-size: 0.875rem;
            margin-top: var(--space-xs);
        }

        .event-card__stats {
            display: flex;
            gap: var(--space-xl);
            margin: var(--space-lg) 0;
            padding: var(--space-md) 0;
            border-top: 1px solid var(--gray-light);
            border-bottom: 1px solid var(--gray-light);
        }

        .stat {
            text-align: center;
        }

        .stat__value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--wine-red);
        }

        .stat__label {
            font-size: 0.75rem;
            color: var(--gray-medium);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .event-card__winner {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            background: var(--wine-champagne);
            padding: var(--space-md);
            border-radius: var(--radius-md);
        }

        .event-card__winner-icon {
            font-size: 2rem;
        }

        .event-card__winner-info {
            flex: 1;
        }

        .event-card__winner-name {
            font-weight: 600;
            color: var(--wine-burgundy);
        }

        .event-card__winner-by {
            font-size: 0.875rem;
            color: var(--gray-medium);
        }

        .event-card__winner-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--wine-gold);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--gray-medium);
        }

        .empty-state__icon {
            font-size: 4rem;
            margin-bottom: var(--space-lg);
        }

        .empty-state__title {
            font-size: 1.5rem;
            color: var(--charcoal);
            margin-bottom: var(--space-md);
        }
    </style>
</head>
<body>
    <header class="history-header">
        <a href="../index.html" style="color: white; text-decoration: none; display: inline-block; margin-bottom: var(--space-md);">
            <span style="font-size: 2rem;">🍷</span>
        </a>
        <h1>Event History</h1>
        <p style="opacity: 0.8;">Browse past tastings and wine ratings</p>

        <nav class="history-header__nav">
            <a href="index.html" class="active">Past Events</a>
            <a href="wines.html">All Wines</a>
        </nav>
    </header>

    <main class="history-content">
        <div id="eventsList">
            <div class="loading">
                <div class="loading__spinner"></div>
                <div class="loading__text">Loading events...</div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/event-manager.js"></script>
    <script src="../js/wine-manager.js"></script>
    <script src="../js/rating-manager.js"></script>
    <script src="../js/scoring.js"></script>
    <script>
        const eventsList = document.getElementById('eventsList');

        async function loadEvents() {
            await WineClubAuth.ensureSignedIn();

            try {
                const events = await EventManager.getCompletedEvents();

                if (events.length === 0) {
                    eventsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state__icon">🍷</div>
                            <h2 class="empty-state__title">No past events yet</h2>
                            <p>Complete your first tasting event to see it here!</p>
                            <a href="../index.html" class="btn btn--primary mt-lg">Start an Event</a>
                        </div>
                    `;
                    return;
                }

                // Load details for each event
                let html = '';
                for (const event of events) {
                    const summary = await Scoring.getEventSummary(event.id);

                    const date = event.createdAt?.toDate?.()
                        ? event.createdAt.toDate().toLocaleDateString('en-US', {
                            weekday: 'long',
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        })
                        : 'Unknown date';

                    html += `
                        <div class="event-card">
                            <div class="event-card__header">
                                <div>
                                    <h2 class="event-card__title">${event.title}</h2>
                                    ${event.theme ? `<div class="event-card__theme">${event.theme}</div>` : ''}
                                </div>
                                <div class="event-card__date">${date}</div>
                            </div>

                            <div class="event-card__stats">
                                <div class="stat">
                                    <div class="stat__value">${summary.totalWines}</div>
                                    <div class="stat__label">Wines</div>
                                </div>
                                <div class="stat">
                                    <div class="stat__value">${summary.totalParticipants}</div>
                                    <div class="stat__label">Tasters</div>
                                </div>
                                <div class="stat">
                                    <div class="stat__value">${summary.totalRatings}</div>
                                    <div class="stat__label">Ratings</div>
                                </div>
                                <div class="stat">
                                    <div class="stat__value">${summary.averageOverall.toFixed(1)}</div>
                                    <div class="stat__label">Avg Score</div>
                                </div>
                            </div>

                            ${summary.winner ? `
                                <div class="event-card__winner">
                                    <div class="event-card__winner-icon">👑</div>
                                    <div class="event-card__winner-info">
                                        <div class="event-card__winner-name">${summary.winner.name}</div>
                                        <div class="event-card__winner-by">by ${summary.winner.broughtByName}</div>
                                    </div>
                                    <div class="event-card__winner-score">${summary.winner.averageRating.toFixed(1)}</div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                eventsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading events:', error);
                eventsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state__icon">😕</div>
                        <h2 class="empty-state__title">Error loading events</h2>
                        <p>Please try refreshing the page.</p>
                    </div>
                `;
            }
        }

        loadEvents();
    </script>
</body>
</html>
